apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cytobank-rails
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ORG/cytobank-gitops.git
    targetRevision: main
    path: apps/cytobank-rails
  destination:
    server: https://kubernetes.default.svc
    namespace: cytobank-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
