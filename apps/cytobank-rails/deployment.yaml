apiVersion: apps/v1
kind: Deployment
metadata:
  name: cytobank-rails
  namespace: cytobank-app
  labels:
    app.kubernetes.io/name: cytobank-rails
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cytobank-rails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cytobank-rails
    spec:
      containers:
        - name: cytobank-rails
          image: 108170245965.dkr.ecr.us-west-2.amazonaws.com/cytobank-rails:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
